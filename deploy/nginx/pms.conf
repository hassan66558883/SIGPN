# Nginx reverse proxy for PMS — TLS termination, HSTS, upload limit, rate limiting.
limit_req_zone $binary_remote_addr zone=pms_login:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=pms_api:10m rate=120r/m;

server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;

    client_max_body_size 30m;
    server_tokens off;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    location = /login {
        limit_req zone=pms_login burst=10 nodelay;
        proxy_pass http://app:3300;
        include /etc/nginx/proxy_params_pms;
    }

    location /api/ {
        limit_req zone=pms_api burst=60 nodelay;
        proxy_pass http://app:3300;
        include /etc/nginx/proxy_params_pms;
    }

    location /_next/static/ {
        proxy_pass http://app:3300;
        proxy_cache_valid 200 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://app:3300;
        include /etc/nginx/proxy_params_pms;
    }
}
